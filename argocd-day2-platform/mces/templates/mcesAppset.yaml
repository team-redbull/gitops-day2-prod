apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.group }}-mces
  namespace: gitops-{{ .Values.group }}
spec:
  generators:
    - git:
        repoURL: 'https://8200gitlab[REDACTED]/redbull/gitops-day2-prod/sigs/{{ .Values.group }}.git'
        revision: main
        # An MCE is a folder holding a config.yaml (ocpVersion). Folders
        # without one are invisible to this generator. The depth-exact glob
        # makes the path segments trustworthy: path[1] = site, path[2] = env.
        files:
          - path: "sites/*/*/mces/*/config.yaml"
  template:
    metadata:
      name: '{{ .Values.group }}-{{ "{{" }}path.basename{{ "}}" }}'
      namespace: gitops-{{ .Values.repository }}
      labels:
        day2.gitops/team: '{{ .Values.group }}'
        day2.gitops/env: '{{ "{{" }}path[2]{{ "}}" }}'
        day2.gitops/site: '{{ "{{" }}path[1]{{ "}}" }}'
        day2.gitops/mce: '{{ "{{" }}path.basename{{ "}}" }}'
        day2.gitops/ocp-version: '{{ "{{" }}ocpVersion{{ "}}" }}'
        day2.gitops/role: mce
    spec:
      project: '{{ .Values.group }}'
      source:
        repoURL: 'https://8200gitlab[REDACTED]/redbull/gitops-day2-prod/argocd-day2-platform.git'
        targetRevision: main
        path: clusters
        helm:
          ignoreMissingValueFiles: true
          values: |
            group: '{{ .Values.group }}'
            mce: '{{ "{{" }}path.basename{{ "}}" }}'
            mcePath: '{{ "{{" }}path{{ "}}" }}'
            env: '{{ "{{" }}path[2]{{ "}}" }}'
            site: '{{ "{{" }}path[1]{{ "}}" }}'
            ocpVersion: '{{ "{{" }}ocpVersion{{ "}}" }}'
      destination:
        name: '{{ "{{" }}path.basename{{ "}}" }}'
        namespace: gitops-{{ .Values.group }}
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
