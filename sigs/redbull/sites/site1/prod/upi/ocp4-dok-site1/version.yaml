# OPTIONAL. The OCP version of this UPI cluster, read at render time by the
# platform's upiAppset. day1 provisions MCEs and hosted clusters only, so a UPI
# cluster declares its own version here — or has no file and is version-less
# like prod-hub (no ocp-versions/<v>/ pins, no ocp-version label).
#
# THIS FILE MUST CARRY `mastertag` AND NOTHING ELSE — it is loaded as a helm
# value file, so any other top-level key silently becomes a chart value.
#
# Hand-maintained: nothing provisions or verifies it. Whoever upgrades the
# cluster updates it, in every team repo that has this cluster. Create the
# operators/<chart>/ocp-versions/<new>/ layers BEFORE changing it. The arch
# suffix is optional.
mastertag: 4.16.27-x86_64
